<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students data</title>
</head>
<body>
    <h1>All Students Data</h1>
    <a href="{% url 'student_create' %}">Add Another Student</a>
    <ul>
        {% for std in students %}
        <li>
            <a href="{% url 'student_details' std.pk %}">{{ std.name }}-{{ std.email }}</a>
            <a href="{% url 'student_edit' std.pk %}">Edit</a>
            <a href="{% url 'student_delete' std.pk %}" onclick="return confirm('Are you sure you want to delete this student?')">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
